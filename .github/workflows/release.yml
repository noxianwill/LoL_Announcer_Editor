name: Build My Project

on:
  push:
    tags:
      - 'beta-1.0.0' # This is the "Go" signal

permissions:
  contents: write
  discussions: write

jobs:
  build_job:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the C# Compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Turn code into a program
        run: dotnet publish -c Release -o ./my_built_files

      - name: Put the program in a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-1.0.0
          prerelease: true
          discussion_category_name: "Announcements"
          files: ./my_built_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
