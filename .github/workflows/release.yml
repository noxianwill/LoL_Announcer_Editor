name: Build My Project

on:
  push:
    tags:
      - 'beta-1.1.0' # Note: We will use a new tag to trigger this update

permissions:
  contents: write
  discussions: write

jobs:
  build_job:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the C# Compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Turn code into a program
        run: dotnet publish -c Release -o ./my_built_files

      - name: Zip the files
        shell: pwsh
        run: Compress-Archive -Path ./my_built_files/* -DestinationPath ./LoL_Announcer_Editor_Beta.zip

      - name: Put the program in a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-1.1.0
          prerelease: true
          discussion_category_name: "Announcements"
          files: ./LoL_Announcer_Editor_Beta.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
